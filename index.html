<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Graph Visualization</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 12px 20px;
        }

        /* --- Main View Header --- */
        #main-header h1 {
            color: #333;
            font-size: 20px;
            margin-bottom: 8px;
        }

        /* --- Sub-graph Header --- */
        #subgraph-header {
            display: none;
            align-items: center;
            gap: 14px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        #back-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        #back-link:hover {
            background: rgba(96, 165, 250, 0.15);
            text-decoration: underline;
        }

        #subgraph-node-name {
            font-size: 16px;
            font-weight: 700;
            flex-grow: 1;
        }

        #subgraph-tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            padding: 5px 14px;
            border: 1px solid #475569;
            background: transparent;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-btn:hover:not(.active) {
            background: #334155;
            color: #e2e8f0;
        }

        /* --- Shared Controls --- */
        #controls {
            margin-bottom: 10px;
            font-size: 13px;
            color: #555;
        }
        #controls label {
            margin-right: 15px;
            cursor: pointer;
        }

        /* --- Visualization Containers --- */
        .viz-container {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0;
            display: block;
            width: 100%;
            height: calc(100vh - 120px);
            overflow: hidden;
            cursor: grab;
        }
        .viz-container:active {
            cursor: grabbing;
        }

        /* --- Empty state message --- */
        .empty-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            font-size: 16px;
            font-style: italic;
        }

        /* --- Context Menu --- */
        #context-menu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            padding: 4px 0;
            min-width: 220px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            animation: ctxFadeIn 0.12s ease-out;
        }

        @keyframes ctxFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #ctx-open-tab {
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        #ctx-open-tab:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <!-- Main view header (hidden in sub-graph mode) -->
    <div id="main-header">
        <h1>icon.f90 Call Graph (3 Hops)</h1>
    </div>

    <!-- Sub-graph header (hidden in main mode) -->
    <div id="subgraph-header">
        <a href="index.html" id="back-link">← Back to Main View</a>
        <span id="subgraph-node-name"></span>
        <div id="subgraph-tabs">
            <button id="tab-callees" class="tab-btn active">▼ Callees</button>
            <button id="tab-callers" class="tab-btn">▲ Callers</button>
        </div>
    </div>

    <!-- Shared controls -->
    <div id="controls">
        <label><input type="checkbox" id="toggle-edges" checked> Show Edges</label>
        <label><input type="checkbox" id="toggle-orthogonal"> Orthogonal Edges</label>
        <label><input type="checkbox" id="toggle-boxes" checked> Show File Bounding Boxes</label>
        <label><input type="checkbox" id="toggle-folder-boxes" checked> Show Folder Bounding Boxes</label>
    </div>

    <!-- Callees / main visualization -->
    <div id="visualization" class="viz-container"></div>

    <!-- Callers visualization (only used in sub-graph mode) -->
    <div id="visualization-callers" class="viz-container" style="display:none;"></div>

    <!-- Context menu (hidden by default, positioned on right-click) -->
    <div id="context-menu">
        <div id="ctx-open-tab">🔍 Open in New Tab</div>
    </div>

    <!-- D3.js library from CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Custom visualization scripts -->
    <script src="parser.js"></script>
    <script src="layout.js"></script>
    <script src="render.js"></script>
    <script src="main.js"></script>
</body>
</html>
