<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Graph Visualization</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8fafc;
            padding: 4px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Left Header Bar --- */
        #left-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 38px;
            flex-shrink: 0;
        }

        /* --- Main View Header --- */
        #main-header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        #main-header h1 {
            color: #1e293b;
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
        }

        /* --- Graph Search Bar --- */
        .graph-search-container {
            display: inline-flex;
            align-items: center;
        }

        .search-input-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 2px 6px 2px 8px;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .search-input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search-input-wrapper.has-error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .search-icon {
            font-size: 13px;
            color: #94a3b8;
            user-select: none;
            display: flex;
            align-items: center;
        }

        #graph-search-input {
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 12px;
            color: #1e293b;
            width: 260px;
            padding: 3px 0;
            transition: width 0.2s ease;
        }

        #graph-search-input:focus {
            width: 310px;
        }

        #graph-search-input::placeholder {
            color: #94a3b8;
            font-size: 11.5px;
        }

        .search-match-count {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
            background: #f1f5f9;
            color: #475569;
            white-space: nowrap;
            user-select: none;
            line-height: 1.4;
        }

        .search-match-count.has-matches {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .search-match-count.no-matches {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .search-nav-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #64748b;
            font-size: 10px;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.15s ease;
        }

        .search-nav-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .search-nav-btn:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }

        .search-clear-btn {
            background: transparent;
            border: none;
            border-radius: 50%;
            color: #94a3b8;
            font-size: 12px;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.15s ease;
        }

        .search-clear-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        /* --- SVG Search Highlighting Animations --- */
        @keyframes activeMatchPulse {
            0% {
                stroke-opacity: 0.95;
                stroke-width: 2.5px;
            }
            50% {
                stroke-opacity: 0.35;
                stroke-width: 5px;
            }
            100% {
                stroke-opacity: 0.95;
                stroke-width: 2.5px;
            }
        }

        .search-active-pulse {
            animation: activeMatchPulse 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        /* --- Node & Edge Highlighting Contrast & Transitions --- */
        .node-g {
            cursor: pointer;
            transition: opacity 0.12s ease;
        }

        .node-rect {
            transition: fill 0.12s ease, stroke 0.12s ease, stroke-width 0.12s ease, filter 0.12s ease;
        }

        .node-text {
            transition: fill 0.12s ease;
            user-select: none;
            pointer-events: none;
        }

        /* --- Degree "hats": incoming (top) / outgoing (bottom) bars on nodes --- */
        .degree-hat {
            fill: #94a3b8;
            pointer-events: none;
            transition: opacity 0.12s ease;
        }

        /* The bars are hidden whenever edges are actually visible: either the
           "Edges" toggle is on, or the node's edges are highlighted. */
        svg:not(.edges-off) .degree-hat,
        svg.edges-off .node-g.node-primary-highlight .degree-hat,
        svg.edges-off .node-g.node-connected-highlight .degree-hat {
            opacity: 0;
        }

        .graph-edge {
            cursor: crosshair;
            transition: stroke 0.12s ease, stroke-width 0.12s ease, opacity 0.12s ease;
        }

        /* Edges hidden by default: only the highlighted edges of the hovered/clicked
           node are brought back into view. Applies when the "Edges" toggle is off. */
        svg.edges-off .graph-edge {
            opacity: 0 !important;
            pointer-events: none;
        }

        svg.edges-off .graph-edge.edge-primary-highlight,
        svg.edges-off .graph-edge.edge-connected-highlight {
            opacity: 1 !important;
            pointer-events: stroke;
        }

        /* Container-level dimming (O(1) browser-native CSS opacity handling) */
        svg.has-highlight.dim-enabled .node-g {
            opacity: 0.5;
        }

        svg.has-highlight.dim-enabled .graph-edge {
            opacity: 0.5;
        }

        /* Search active dimming */
        svg.has-search-active .node-g {
            opacity: 0.35;
        }

        svg.has-search-active .node-g.search-match {
            opacity: 1;
        }

        svg.has-search-active .graph-edge {
            opacity: 0.15;
        }

        svg.has-search-active.has-highlight.dim-enabled .node-g {
            opacity: 0.25;
        }

        svg.has-search-active.has-highlight.dim-enabled .node-g.search-match {
            opacity: 0.5;
        }

        /* Active highlight states always stay 100% visible */
        svg .node-g.node-primary-highlight,
        svg .node-g.node-connected-highlight {
            opacity: 1 !important;
        }

        /* Primary node (hovered or clicked) */
        .node-g.node-primary-highlight .node-rect {
            fill: #0f172a !important;
            stroke: #38bdf8 !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 4px 8px rgba(15, 23, 42, 0.45)) !important;
        }

        .node-g.node-primary-highlight.node-active-tab .node-rect {
            stroke: #34d399 !important;
            filter: drop-shadow(0 4px 10px rgba(5, 150, 105, 0.55)) !important;
        }

        .node-g.node-primary-highlight .node-text {
            fill: #ffffff !important;
        }

        .node-g.node-primary-highlight .node-text tspan {
            font-weight: 700 !important;
        }

        .node-g.node-primary-highlight .node-text tspan:last-child {
            font-weight: 800 !important;
        }

        /* Connected nodes */
        .node-g.node-connected-highlight .node-rect {
            fill: #2563eb !important;
            stroke: #1d4ed8 !important;
            stroke-width: 2px !important;
            filter: none !important;
        }

        .node-g.node-connected-highlight.node-active-tab .node-rect {
            fill: #059669 !important;
            stroke: #34d399 !important;
            stroke-width: 2.5px !important;
            filter: url(#glow-emerald) !important;
        }

        .node-g.node-connected-highlight .node-text {
            fill: #ffffff !important;
        }

        .node-g.node-connected-highlight .node-text tspan {
            font-weight: 600 !important;
        }

        .node-g.node-connected-highlight .node-text tspan:last-child {
            font-weight: 700 !important;
        }

        /* Edge highlighting */
        svg .graph-edge.edge-primary-highlight {
            opacity: 1 !important;
            stroke: #2563eb !important;
            stroke-width: 2.5px !important;
        }

        svg .graph-edge.edge-connected-highlight {
            opacity: 1 !important;
            stroke: #3b82f6 !important;
            stroke-width: 2px !important;
        }

        /* Search match styling */
        .node-g.search-match-active .node-rect {
            fill: #ff5722 !important;
            stroke: #b91c1c !important;
            stroke-width: 3.5px !important;
            filter: url(#glow-active) !important;
        }
        .node-g.search-match-active .node-text {
            fill: #ffffff !important;
        }
        .node-g.search-match-function .node-rect {
            fill: #f59e0b;
            stroke: #b45309;
            stroke-width: 2.5px;
            filter: url(#glow-amber);
        }
        .node-g.search-match-function .node-text {
            fill: #0f172a;
        }
        .node-g.search-match-file .node-rect {
            fill: #8b5cf6;
            stroke: #5b21b6;
            stroke-width: 2.5px;
            filter: url(#glow-amber);
        }
        .node-g.search-match-file .node-text {
            fill: #ffffff;
        }
        .node-g.search-match-folder .node-rect {
            fill: #06b6d4;
            stroke: #0e7490;
            stroke-width: 2.5px;
            filter: url(#glow-amber);
        }
        .node-g.search-match-folder .node-text {
            fill: #ffffff;
        }

        /* --- Sub-graph Header --- */
        #subgraph-header {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 2px 8px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
            border-radius: 6px;
            margin: 0;
            flex-wrap: wrap;
        }

        #back-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        #back-link:hover {
            background: rgba(96, 165, 250, 0.15);
            text-decoration: underline;
        }

        #subgraph-node-name {
            font-size: 14px;
            font-weight: 700;
            flex-grow: 1;
        }

        #subgraph-tabs {
            display: flex;
            gap: 4px;
        }

        .tab-btn {
            padding: 3px 10px;
            border: 1px solid #475569;
            background: transparent;
            color: #94a3b8;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-btn:hover:not(.active) {
            background: #334155;
            color: #e2e8f0;
        }

        /* --- Shared Controls --- */
        #controls {
            margin: 0;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #controls label {
            margin-right: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .control-divider {
            width: 1px;
            height: 18px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }

        .collapse-controls {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .control-btn {
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            line-height: 1.2;
        }

        .control-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
            border-color: #94a3b8;
        }

        .control-btn:active {
            background: #cbd5e1;
            transform: scale(0.97);
        }

        .control-btn.toggle-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #1d4ed8;
            box-shadow: 0 1px 3px rgba(37, 99, 235, 0.35);
        }

        .control-btn.toggle-btn.active:hover {
            background: #1d4ed8;
            color: #ffffff;
            border-color: #1e40af;
        }

        /* --- Visualization Containers --- */
        #graph-split-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: calc(100vh - 8px);
            overflow: hidden;
            position: relative;
            gap: 4px;
        }

        #left-panel {
            flex: 1 1 0;
            min-width: 260px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
        }

        /* --- Panel Resizer --- */
        .panel-resizer {
            width: 6px;
            cursor: col-resize;
            background: #e2e8f0;
            user-select: none;
            flex-shrink: 0;
            z-index: 20;
            transition: background 0.15s;
            position: relative;
            border-radius: 3px;
        }
        .panel-resizer:hover, body.resizing .panel-resizer {
            background: #3b82f6;
        }
        .panel-resizer::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 24px;
            background: #94a3b8;
            border-radius: 1px;
        }
        .panel-resizer:hover::after, body.resizing .panel-resizer::after {
            background: #ffffff;
        }
        body.resizing {
            cursor: col-resize !important;
            user-select: none !important;
        }

        /* --- Detail Panel --- */
        #detail-panel {
            flex: 0 0 540px;
            min-width: 320px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            z-index: 10;
        }

        #detail-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            color: #f1f5f9;
            padding: 3px 8px;
            border-bottom: 1px solid #334155;
            min-height: 38px;
            flex-shrink: 0;
        }

        .detail-tab-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: thin;
            flex: 1;
            align-items: center;
            margin-right: 8px;
            padding-bottom: 1px;
        }
        .detail-tab-bar::-webkit-scrollbar {
            height: 4px;
        }
        .detail-tab-bar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }

        .detail-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: #334155;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            user-select: none;
            max-width: 220px;
            border: 1px solid transparent;
        }
        .detail-tab:hover {
            background: #475569;
            color: #f8fafc;
        }
        .detail-tab.active {
            background: #0f172a;
            color: #34d399;
            border-color: #10b981;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35);
        }

        .detail-tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .detail-tab-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            font-size: 14px;
            line-height: 1;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s;
        }
        .detail-tab-close:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #ef4444;
        }

        .panel-close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel-close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        @keyframes tabPulse {
            0% { transform: scale(1); background-color: #10b981; color: #fff; }
            50% { transform: scale(1.08); background-color: #059669; color: #fff; }
            100% { transform: scale(1); }
        }
        .tab-highlight-pulse {
            animation: tabPulse 0.5s ease-out;
        }

        @keyframes emeraldRingPulse {
            0%, 100% { stroke-opacity: 0.9; stroke-width: 2px; }
            50% { stroke-opacity: 0.45; stroke-width: 2.8px; }
        }
        .active-tab-ring {
            animation: emeraldRingPulse 2s ease-in-out infinite;
        }

        .detail-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: #f8fafc;
        }

        .tab-content-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-sub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            gap: 12px;
        }

        .tab-sub-title {
            font-size: 13px;
            font-weight: 700;
            color: #065f46;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab-sub-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #059669;
            box-shadow: 0 0 6px rgba(5, 150, 105, 0.6);
            flex-shrink: 0;
        }

        .tab-sub-nav {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .tab-sub-btn {
            padding: 4px 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .tab-sub-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-sub-btn:hover:not(.active) {
            background: #e2e8f0;
            color: #1e293b;
        }

        .tab-sub-body {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .viz-container {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0;
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            position: relative;
        }
        .viz-container.tab-viz {
            border: none;
            border-radius: 0;
        }
        .viz-container:active {
            cursor: grabbing;
        }

        /* --- Floating "Back to Graph" Navigation Button --- */
        .btn-back-to-graph {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            border: 1px solid #38bdf8;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.4), 0 0 12px rgba(56, 189, 248, 0.35);
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px) scale(0.95);
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.2s,
                        box-shadow 0.2s,
                        border-color 0.2s;
            user-select: none;
            white-space: nowrap;
        }

        .btn-back-to-graph.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            animation: backBtnPulse 2.4s infinite ease-in-out;
        }

        .btn-back-to-graph:hover {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-color: #60a5fa;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.5), 0 0 18px rgba(96, 165, 250, 0.55);
            transform: translateY(-2px) scale(1.02);
        }

        .btn-back-to-graph:active {
            transform: translateY(0) scale(0.97);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.4);
        }

        .back-graph-arrow {
            font-size: 15px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            transition: transform 0.2s ease;
        }

        .btn-back-to-graph:hover .back-graph-arrow {
            transform: scale(1.2);
            color: #60a5fa;
        }

        .back-graph-text {
            letter-spacing: 0.2px;
        }

        @keyframes backBtnPulse {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(15, 23, 42, 0.4), 0 0 10px rgba(56, 189, 248, 0.3);
            }
            50% {
                box-shadow: 0 4px 20px rgba(15, 23, 42, 0.5), 0 0 20px rgba(56, 189, 248, 0.6);
            }
        }

        /* --- Empty state message --- */
        .empty-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            font-size: 16px;
            font-style: italic;
        }

        /* --- Context Menu --- */
        #context-menu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            padding: 4px 0;
            min-width: 220px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            animation: ctxFadeIn 0.12s ease-out;
        }

        @keyframes ctxFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #ctx-open-tab {
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        #ctx-open-tab:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <!-- Split view container -->
    <div id="graph-split-container">
        <!-- Left panel: Main visualization (or standalone sub-graph visualization) -->
        <div id="left-panel">
            <div id="left-header-bar">
                <!-- Main view header (hidden in sub-graph mode) -->
                <div id="main-header">
                    <h1>icon.f90 Call Graph</h1>
                    <div id="graph-search-container" class="graph-search-container">
                        <div class="search-input-wrapper">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="graph-search-input" placeholder="Search function, file, folder... (Ctrl+F)" autocomplete="off" spellcheck="false">
                            <span id="search-match-count" class="search-match-count" style="display:none;"></span>
                            <button type="button" id="search-btn-prev" class="search-nav-btn" title="Previous match (Shift+Enter)" style="display:none;">▲</button>
                            <button type="button" id="search-btn-next" class="search-nav-btn" title="Next match (Enter)" style="display:none;">▼</button>
                            <button type="button" id="search-btn-clear" class="search-clear-btn" title="Clear search (Esc)" style="display:none;">✕</button>
                        </div>
                    </div>
                </div>

                <!-- Sub-graph header (hidden in main mode) -->
                <div id="subgraph-header">
                    <a href="index.html" id="back-link">← Main View</a>
                    <span id="subgraph-node-name"></span>
                    <div id="subgraph-tabs">
                        <button id="tab-combined" class="tab-btn active">⇅ Combined</button>
                        <button id="tab-callees" class="tab-btn">▼ Callees</button>
                        <button id="tab-callers" class="tab-btn">▲ Callers</button>
                    </div>
                </div>

                <!-- Shared controls -->
                <div id="controls">
                    <label><input type="checkbox" id="toggle-edges" title="Show all edges. Off by default — hover or click a node to reveal its edges."> Edges</label>
                    <label><input type="checkbox" id="toggle-orthogonal"> Orthogonal</label>
                    <label><input type="checkbox" id="toggle-boxes" checked> File Boxes</label>
                    <label><input type="checkbox" id="toggle-folder-boxes" checked> Folder Boxes</label>
                    <span class="control-divider"></span>
                    <button type="button" id="btn-toggle-dim" class="control-btn toggle-btn active" title="Toggle dimming unhighlighted elements to 50% opacity">◐ Dim Others: ON</button>
                    <span class="control-divider"></span>
                    <div class="collapse-controls">
                        <button type="button" id="btn-open-all" class="control-btn" title="Open everything: expand all folders and files">Open All</button>
                        <button type="button" id="btn-folders-only" class="control-btn" title="Open every folder only: keep files collapsed">Folders Only</button>
                        <button type="button" id="btn-close-all" class="control-btn" title="Close everything: collapse all folders and files">Close All</button>
                    </div>
                </div>
            </div>

            <!-- Combined / main visualization -->
            <div id="visualization" class="viz-container"></div>

            <!-- Callees visualization (only used in sub-graph mode) -->
            <div id="visualization-callees" class="viz-container" style="display:none;"></div>

            <!-- Callers visualization (only used in sub-graph mode) -->
            <div id="visualization-callers" class="viz-container" style="display:none;"></div>
        </div>

        <!-- Draggable resizer -->
        <div id="panel-resizer" class="panel-resizer" style="display:none;"></div>

        <!-- Right panel: Multi-tab detail panel -->
        <div id="detail-panel" style="display:none;">
            <div id="detail-panel-header">
                <div id="detail-tab-bar" class="detail-tab-bar"></div>
                <button id="detail-panel-close-btn" class="panel-close-btn" title="Close Side Panel">✕</button>
            </div>
            <div id="detail-content-area" class="detail-content-area"></div>
        </div>
    </div>

    <!-- Context menu (hidden by default, positioned on right-click) -->
    <div id="context-menu">
        <div id="ctx-open-tab">🔍 Open in Side Tab</div>
    </div>

    <!-- D3.js library from CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Custom visualization scripts -->
    <script src="parser.js"></script>
    <script src="layout.js"></script>
    <script src="render.js"></script>
    <script src="panel.js"></script>
    <script src="main.js"></script>
</body>
</html>
