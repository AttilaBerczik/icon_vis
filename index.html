<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Graph Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        #visualization {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            display: block;
            max-width: 100%;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>icon.f90 Call Graph (3 Hops)</h1>
    <div id="controls" style="margin-bottom: 20px;">
        <label style="margin-right: 15px;"><input type="checkbox" id="toggle-edges" checked> Show Edges</label>
        <label style="margin-right: 15px;"><input type="checkbox" id="toggle-boxes" checked> Show File Bounding Boxes</label>
        <label><input type="checkbox" id="toggle-folder-boxes" checked> Show Folder Bounding Boxes</label>
    </div>
    <div id="visualization"></div>

    <!-- D3.js library from CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Custom visualization scripts -->
    <script src="parser.js"></script>
    <script src="layout.js"></script>
    <script src="render.js"></script>
    <script src="main.js"></script>
</body>
</html>
